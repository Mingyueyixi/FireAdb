name: libadb
description: 本机 ADB Server。协议在 adb_core，桌面 USB 在本包内随 server 一起初始化。
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.1

dependencies:
  adb_core:
    path: ../adb_core
  code_assets: 1.2.1
  dart_libusb: ^1.0.1
  ffi: ^2.1.0
  hooks: 2.0.2
  logging: ^1.3.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
