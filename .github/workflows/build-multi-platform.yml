name: Build Multi-Platform Packages

on:
  workflow_dispatch: # 手动触发
  push:
    tags:
      - 'v*' # 打 tag 时自动触发，如 v1.0.0、v1.1.0

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          $zipName = "adb_toolbox-windows-x64-v$version.zip"
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: adb_toolbox-windows-x64
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload to Release (only on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          fail_on_unmatched_files: true

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

      - name: Package Linux tar.gz
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr -d ' ')
          TAR_NAME="adb_toolbox-linux-x64-v$VERSION.tar.gz"
          tar -czf "$TAR_NAME" -C build/linux/x64/release bundle
          echo "TAR_NAME=$TAR_NAME" >> $GITHUB_ENV

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: adb_toolbox-linux-x64
          path: ${{ env.TAR_NAME }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload to Release (only on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.TAR_NAME }}
          fail_on_unmatched_files: true

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android APK
        working-directory: app # pub workspace：Flutter 工程在 app/ 下
        run: flutter build apk --release --target-platform android-arm64 # 只要 arm64-v8a

      - name: Package Android APK
        run: |
          VERSION=$(grep '^version:' app/pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          APK_NAME="adb_toolbox-android-arm64-v$VERSION.apk"
          cp app/build/app/outputs/flutter-apk/app-release.apk "$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: adb_toolbox-android-arm64
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload to Release (only on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
          fail_on_unmatched_files: true