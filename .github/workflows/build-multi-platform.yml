name: Build Multi-Platform Packages

on:
  workflow_dispatch: # 手动触发
  push:
    tags:
      - 'v*' # 打 tag 时自动触发，如 v1.0.0、v1.1.0

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build & package Windows release
        id: build
        run: python scripts/build_app.py windows --release # 脚本自行进入 app/，注入构建信息并压 zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: fire-adb-windows-x64
          path: ${{ steps.build.outputs.artifact }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload to Release (only on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.artifact }}
          fail_on_unmatched_files: true
          # 不用 generate_release_notes：那是「追加」语义，重打 tag 重跑会
          # 重复追加 changelog；固定正文由 softprops 覆盖更新，重跑幂等
          body: |
            FireAdb 是一个跨平台 ADB 工具箱，支持设备连接、文件管理、应用管理、截图录屏、shell 命令等功能。
            更新内容见 [提交记录](${{ github.server_url }}/${{ github.repository }}/commits/${{ github.ref_name }})。

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build & package Linux release
        id: build
        run: python scripts/build_app.py linux --release # 脚本自行进入 app/，注入构建信息并压 tar.gz

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: fire-adb-linux-x64
          path: ${{ steps.build.outputs.artifact }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload to Release (only on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.artifact }}
          fail_on_unmatched_files: true
          # 不用 generate_release_notes：那是「追加」语义，重打 tag 重跑会
          # 重复追加 changelog；固定正文由 softprops 覆盖更新，重跑幂等
          body: |
            FireAdb 是一个跨平台 ADB 工具箱，支持设备连接、文件管理、应用管理、截图录屏、shell 命令等功能。
            更新内容见 [提交记录](${{ github.server_url }}/${{ github.repository }}/commits/${{ github.ref_name }})。

  notify-release:
    name: Notify Telegram
    needs: [build-windows, build-linux, build-android]
    if: startsWith(github.ref, 'refs/tags/') # 仅 tag 发布时通知
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch release info & download assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json name,body,url > release.json
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir tg_assets --clobber

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install requests
        run: pip install requests

      - name: Send release to Telegram
        continue-on-error: true # 通知失败不影响发布结果
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python scripts/tg_release_notify.py

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build & package Android APK
        id: build
        run: python scripts/build_app.py apk --release --target-platform android-arm64 # 脚本注入构建信息并重命名 APK；只要 arm64-v8a

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: fire-adb-android-arm64
          path: ${{ steps.build.outputs.artifact }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload to Release (only on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.artifact }}
          fail_on_unmatched_files: true
          # 不用 generate_release_notes：那是「追加」语义，重打 tag 重跑会
          # 重复追加 changelog；固定正文由 softprops 覆盖更新，重跑幂等
          body: |
            FireAdb 是一个跨平台 ADB 工具箱，支持设备连接、文件管理、应用管理、截图录屏、shell 命令等功能。
            更新内容见 [提交记录](${{ github.server_url }}/${{ github.repository }}/commits/${{ github.ref_name }})。